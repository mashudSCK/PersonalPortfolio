<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Mashud Shamsher Khalid | Software Builder</title>
    <meta
      name="description"
      content="Practical software, curious experiments, and honest notes from Mashud’s path toward game development."
    />
    <meta name="author" content="Mashud Shamsher Khalid" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#F4F4ED" />
    <link rel="canonical" href="https://mashudkhalid.vercel.app/" />

    <link rel="icon" type="image/png" href="/favicon-32.png" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link
      rel="preload"
      as="image"
      href="/images/mashud-tired-developer.png"
      fetchpriority="high"
      media="(min-width: 1100px)"
    />

    <!-- Open Graph / social share. og:image must be an absolute URL once you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mashud Shamsher Khalid" />
    <meta
      property="og:title"
      content="Mashud Shamsher Khalid | Software Builder"
    />
    <meta
      property="og:description"
      content="Practical software, curious experiments, and honest notes from Mashud’s path toward game development."
    />
    <meta property="og:url" content="https://mashudkhalid.vercel.app/" />
    <meta
      property="og:image"
      content="https://mashudkhalid.vercel.app/images/preview.png"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
