[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://web3forms.com https://js.hcaptcha.com; style-src 'self' 'unsafe-inline' https://web3forms.com https://*.hcaptcha.com; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://api.web3forms.com https://*.hcaptcha.com; frame-src https://*.hcaptcha.com; base-uri 'self'; form-action https://api.web3forms.com; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
